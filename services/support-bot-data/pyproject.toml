[project]
name = "support-bot-data"
version = "0.1.0"
description = "Data-service агента Support Bot: единственный доступ к его БД (mTLS)"
requires-python = ">=3.12"
dependencies = [
  "litestar>=2.15",
  "pydantic>=2.10",
  "sqlalchemy>=2.0",
  "uvicorn>=0.34",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/support_bot_data"]
