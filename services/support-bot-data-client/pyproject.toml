[project]
name = "support-bot-data-client"
version = "0.1.0"
description = "Типизированный mTLS-клиент data-service агента Support Bot"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.28",
  "pydantic>=2.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/support_bot_data_client"]
