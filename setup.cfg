# flake8 + wemake-python-styleguide (flake8 не читает pyproject.toml).
# Форматирование и pycodestyle/pyflakes-правила — на ruff,
# здесь только плагин WPS.

[flake8]
format = wemake
show-source = true
statistics = false
doctests = true
max-line-length = 80
max-complexity = 6
max-imports = 15
max-module-members = 12
max-methods = 12
max-line-complexity = 14

select = WPS, E999
extend-ignore =
  # WPS110: имена value/data/result уместны в DTO и UI-компонентах
  WPS110,
  # WPS226: повтор строк — это Literal-дискриминаторы компонентов
  WPS226,
  # WPS306: явное наследование от object не нужно в py3
  WPS306,
  # WPS348: строки, начинающиеся с точки (ruff format переносит цепочки)
  WPS348,
  # WPS412: логика в __init__.py — нужна для реэкспорта публичного API
  WPS412,
  # WPS431: вложенные классы (Meta в Django)
  WPS431,

exclude =
  .git,
  __pycache__,
  .venv,
  */migrations/*,
  templates,

per-file-ignores =
  # Реэкспорт публичного API
  */__init__.py: WPS410
  # Каталог UI-компонентов — по природе большой модуль
  packages/admin-sdk/src/admin_sdk/ui.py: WPS202
  # Тесты: магические числа, asserts, длинные сценарии
  # (вложенные функции — объявления модулей/хендлеров внутри тестов)
  */tests/*.py: S101, WPS202, WPS204, WPS210, WPS212, WPS218, WPS221, WPS237, WPS407, WPS430, WPS432, WPS442
  */conftest.py: WPS202, WPS442
  # Django settings — «плоский» модуль констант
  core/admin_core/settings.py: WPS407, WPS202
